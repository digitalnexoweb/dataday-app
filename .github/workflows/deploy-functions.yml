name: Deploy Supabase functions

# ---------------------------------------------------------------------------
# Despliega las Edge Functions a Supabase automaticamente.
#
# Se dispara:
#   - manualmente desde Actions > Deploy Supabase functions > Run workflow
#   - al hacer push a `main` que toque supabase/functions/**
#
# REQUISITO (una sola vez):
#   Settings > Secrets and variables > Actions > New repository secret
#     Nombre : SUPABASE_ACCESS_TOKEN
#     Valor  : token de acceso personal de Supabase
#              (https://supabase.com/dashboard/account/tokens)
#
# Notas sobre verify_jwt:
#   - email-access-review / notify-access-request / admin-access-requests se
#     invocan desde links de email o sin sesion -> --no-verify-jwt
#   - submit-access-request se invoca desde el frontend con la anon key
#     (JWT valido) -> verify_jwt por defecto (true)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gyiivrjjecymkpvkqpfy
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar secret
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Deploy functions
        run: |
          set -euo pipefail
          supabase functions deploy email-access-review  --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy notify-access-request --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-access-requests --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy submit-access-request --project-ref "$PROJECT_REF"
